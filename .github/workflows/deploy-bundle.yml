# .github/workflows/deploy-bundle.yml
#
# Entrega de dependências no cluster (job_cluster/serverless) é 100% declarativa,
# resolvida pelo `databricks bundle deploy` abaixo — sem step manual de venv/
# init_script/Volume aqui. O wheel do próprio bundle vem de um bloco `artifacts:`
# no `databricks.yml` (a CLI builda e sobe sozinha); as libs-framework vêm do
# Environment nativo do job, referenciando os wheels publicados como asset de
# Release em platform-libs (ver release-package.yml). Decisão validada via
# /grill-me: o design original (venv empacotada + init_script) nunca chegou a
# ser implementado aqui — os bundles já rodam em serverless, sem cluster spec.
name: Deploy Bundle (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Caminho do bundle DAB dentro do repositório chamador.
        required: true
        type: string
      bundle-target:
        description: Target do bundle (dev, prod, etc.).
        required: false
        type: string
        default: dev
      python-version:
        required: false
        type: string
        default: "3.11"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          pip install build # usado pelo bloco `artifacts:` do databricks.yml, se houver
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run unit tests
        run: pytest

      # Um bundle migrado declara conf/variables.yml e NÃO versiona databricks.yml
      # nem resources/ — ambos são materializados aqui. Um bundle ainda não
      # migrado cai no caminho legado. Os dois convivem enquanto o exemplo-domain
      # migra um componente por vez; o ramo legado sai quando o último migrar.
      - name: Materialize the DAB bundle
        run: |
          if [ -f conf/variables.yml ]; then
            mlp-generate-bundle
          elif [ -f scripts/generate_resources.py ]; then
            echo "bundle ainda não migrado — usando o gerador legado"
            python scripts/generate_resources.py
          else
            echo "sem conf/variables.yml e sem gerador legado — nada a materializar"
          fi

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle
        run: |
          databricks bundle deploy -t ${{ inputs.bundle-target }} \
            --var="git_commit=${{ github.sha }}" \
            --var="git_branch=${{ github.ref_name }}"
