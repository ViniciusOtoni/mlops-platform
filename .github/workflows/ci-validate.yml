# .github/workflows/ci-validate.yml
name: CI Validate (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Caminho do pacote/bundle dentro do repositório chamador.
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.11"
      check-version-tag:
        description: Falha se a tag '<nome>-v<versao>' do pyproject.toml já existir.
        required: false
        type: boolean
        default: true
      validate-bundle:
        description: Roda `databricks bundle validate` no working-directory.
        required: false
        type: boolean
        default: false
      ruff-config:
        description: >-
          Config de lint dentro do mlops-platform. O default é o baseline do
          ecossistema; o platform-libs passa `ruff-framework.toml`, que adiciona
          o contrato de arquitetura interna do framework.
        required: false
        type: string
        default: ruff.toml

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico de tags para o check-version-tag

      - name: Checkout mlops-platform (ruff config + scripts compartilhados)
        uses: actions/checkout@v4
        with:
          repository: ViniciusOtoni/mlops-platform
          path: .mlops-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          pip install ruff
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint (ruff)
        run: ruff check --config "$GITHUB_WORKSPACE/.mlops-platform/${{ inputs.ruff-config }}" .

      - name: Run unit tests
        run: pytest

      - name: Check version bump against existing tags
        if: inputs.check-version-tag
        run: python "$GITHUB_WORKSPACE/.mlops-platform/scripts/check_version_tag.py" .

      - name: Install Databricks CLI
        if: inputs.validate-bundle
        uses: databricks/setup-cli@main

      # Um bundle migrado não versiona databricks.yml — sem materializar antes,
      # o validate rodaria contra um bundle que ainda não existe. Bundles não
      # migrados seguem pelo gerador legado enquanto a migração acontece
      # componente a componente.
      - name: Materialize the DAB bundle
        if: inputs.validate-bundle
        run: |
          if [ -f conf/variables.yml ]; then
            mlp-generate-bundle
          elif [ -f scripts/generate_resources.py ]; then
            echo "bundle ainda não migrado — usando o gerador legado"
            python scripts/generate_resources.py
          else
            echo "sem conf/variables.yml e sem gerador legado — nada a materializar"
          fi

      - name: Validate bundle syntax
        if: inputs.validate-bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate
