# .github/workflows/retrain-on-drift.yml
#
# Retreino disparado por drift, com aprovação humana antes da promoção.
#
# O job de drift no Databricks detecta deslocamento, dispara um
# `repository_dispatch` no repositório do domínio, e o workflow do domínio chama
# este aqui. São dois jobs de propósito:
#
#   retrain  -> treina e REGISTRA o candidato, sem promover
#   promote  -> move o alias, atrás de um GitHub Environment com reviewers
#
# A separação é o ponto todo. Drift é sinal de que o mundo mudou, não prova de
# que o modelo novo é melhor: pode ter treinado sobre o mesmo dado deslocado e
# aprendido o deslocamento. Promover automaticamente trocaria um modelo
# defasado por um modelo desconhecido, sem ninguém olhar. O candidato fica
# registrado, com run e métricas no MLflow, e alguém decide.
name: Retrain on Drift (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Caminho do bundle de training dentro do repositório chamador.
        required: true
        type: string
      domain:
        description: Domínio da config (o campo `domain`, não o nome do entry point).
        required: true
        type: string
      model-name:
        required: true
        type: string
      training-job-name:
        description: Nome do job de treino no workspace, como o gerador o nomeia.
        required: false
        type: string
        default: training_pipeline
      catalog:
        required: false
        type: string
        default: workspace
      alias:
        description: Alias a promover depois da aprovação.
        required: false
        type: string
        default: champion
      promotion-environment:
        description: >-
          GitHub Environment que guarda a promoção. É nele que se configura
          "Required reviewers" — sem isso o gate não existe e o job promove
          direto.
        required: false
        type: string
        default: model-promotion
      python-version:
        required: false
        type: string
        default: "3.11"

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the domain bundle
        # Traz o mlplatform junto, que é de onde vêm os entry points usados abaixo.
        run: pip install -e .

      - uses: databricks/setup-cli@main

      - name: Resolve the training job id
        id: job
        run: |
          set -euo pipefail
          # O DABs prefixa o nome do job por target (`[dev <usuario>] <nome>`),
          # então a busca é por sufixo, não por igualdade.
          job_id=$(databricks jobs list --output json \
            | python -c "
import sys, json
target = '${{ inputs.training-job-name }}'
data = json.load(sys.stdin)
jobs = data if isinstance(data, list) else data.get('jobs', [])
hits = [j['job_id'] for j in jobs if j.get('settings', {}).get('name', '').endswith(target)]
if len(hits) != 1:
    raise SystemExit(f'esperava 1 job terminando em {target!r}, achei {len(hits)}')
print(hits[0])
")
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Retrain without promoting
        # `promotion_alias=none` é o que segura o candidato. Sem isso o treino
        # promoveria sozinho e a aprovação abaixo julgaria um modelo que já
        # está servindo.
        run: |
          databricks jobs run-now --json '{
            "job_id": ${{ steps.job.outputs.job_id }},
            "job_parameters": {"promotion_alias": "none"}
          }'

      - name: Capture the candidate version
        id: candidate
        # A versão é FIXADA aqui, e não resolvida na hora da promoção: entre a
        # aprovação e o promote pode ter rodado um treino agendado, e quem
        # aprovou inspecionou uma versão específica.
        run: |
          set -euo pipefail
          version=$(mlp-model-version \
            --catalog "${{ inputs.catalog }}" \
            --domain "${{ inputs.domain }}" \
            --model_name "${{ inputs.model-name }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Candidato registrado: v$version (ainda NÃO promovido)"

      - name: Summarise what needs review
        run: |
          {
            echo "### Candidato aguardando revisão"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| modelo | \`${{ inputs.catalog }}.${{ inputs.domain }}_models.${{ inputs.model-name }}\` |"
            echo "| versão | **v${{ steps.candidate.outputs.version }}** |"
            echo "| alias a promover | \`${{ inputs.alias }}\` |"
            echo ""
            echo "Compare a run desta versão contra a do champion atual no MLflow"
            echo "antes de aprovar. Drift indica que o mundo mudou — não que o"
            echo "modelo novo esteja melhor."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: retrain
    runs-on: ubuntu-latest
    # É AQUI que a aprovação manual acontece. O Environment precisa ter
    # "Required reviewers" configurado no repositório; sem isso este job roda
    # direto e o gate é decorativo.
    environment: ${{ inputs.promotion-environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the domain bundle
        run: pip install -e .

      - name: Promote the approved version
        run: |
          mlp-promote-model \
            --catalog "${{ inputs.catalog }}" \
            --domain "${{ inputs.domain }}" \
            --model_name "${{ inputs.model-name }}" \
            --version "${{ needs.retrain.outputs.version }}" \
            --alias "${{ inputs.alias }}"

      - name: Record the promotion
        run: |
          {
            echo "### Promovido"
            echo ""
            echo "\`${{ inputs.model-name }}@${{ inputs.alias }}\` -> **v${{ needs.retrain.outputs.version }}**"
            echo ""
            echo "O serving batch passa a usar a versão nova na próxima execução."
            echo "O endpoint online precisa do job \`refresh_endpoint\` para reapontar."
          } >> "$GITHUB_STEP_SUMMARY"
