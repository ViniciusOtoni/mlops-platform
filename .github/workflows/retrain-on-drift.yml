# .github/workflows/retrain-on-drift.yml
#
# Retreino disparado por drift.
#
# O job de drift no Databricks detecta deslocamento, dispara um
# `repository_dispatch` no repositório do domínio, e o workflow do domínio chama
# este aqui. Ele treina e REGISTRA o candidato — e não promove.
#
# A promoção vive em `promote-model.yml`, disparada à mão. A separação é o
# ponto: drift é sinal de que o mundo mudou, não prova de que o modelo novo é
# melhor. Ele pode ter treinado sobre o mesmo dado deslocado e aprendido o
# deslocamento. Promover automaticamente trocaria um modelo defasado por um
# desconhecido, sem ninguém olhar.
#
# Por que a promoção não é um segundo job guardado por `environment:` aqui:
# "Required reviewers" é recurso de plano. Num repositório privado de conta
# gratuita a API responde 422 e o Environment é criado SEM regra alguma — o job
# passaria direto e o gate seria decorativo, que é pior que não ter gate.
# `workflow_dispatch` exige que uma pessoa clique, em qualquer plano.
name: Retrain on Drift (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Caminho do bundle de training dentro do repositório chamador.
        required: true
        type: string
      domain:
        description: Domínio da config (o campo `domain`, não o nome do entry point).
        required: true
        type: string
      model-name:
        required: true
        type: string
      training-job-name:
        description: Nome do job de treino no workspace, como o gerador o nomeia.
        required: false
        type: string
        default: training_pipeline
      catalog:
        required: false
        type: string
        default: workspace
      alias:
        description: Alias que a promoção manual vai mover, quando aprovada.
        required: false
        type: string
        default: champion
      python-version:
        required: false
        type: string
        default: "3.11"

jobs:
  retrain:
    runs-on: ubuntu-latest
    # Sem bloco `permissions:` pedindo escrita. Um workflow reutilizável não
    # pode escalar além do teto do chamador, e um repositório com
    # `default_workflow_permissions: read` — o padrão de conta gratuita —
    # recusa o workflow inteiro no parse. O resultado é startup_failure sem
    # job, sem log e sem mensagem na UI.
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the domain bundle
        # Traz o mlplatform junto, que é de onde vêm os entry points usados abaixo.
        run: pip install -e .

      - uses: databricks/setup-cli@main

      - name: Resolve the training job id
        id: job
        # O DABs prefixa o nome do job por target (`[dev <usuario>] <nome>`),
        # então a busca é por sufixo, não por igualdade.
        run: |
          set -euo pipefail
          databricks jobs list --output json > /tmp/jobs.json
          job_id=$(python - "${{ inputs.training-job-name }}" <<'SCRIPT'
          import json
          import sys

          target = sys.argv[1]
          with open("/tmp/jobs.json", encoding="utf-8") as handle:
              data = json.load(handle)
          jobs = data if isinstance(data, list) else data.get("jobs", [])
          hits = [j["job_id"] for j in jobs if j.get("settings", {}).get("name", "").endswith(target)]
          if len(hits) != 1:
              raise SystemExit(f"esperava 1 job terminando em {target!r}, achei {len(hits)}")
          print(hits[0])
          SCRIPT
          )
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Retrain without promoting
        # `promotion_alias=none` é o que segura o candidato. Sem isso o treino
        # promoveria sozinho e a revisão abaixo julgaria um modelo que já está
        # servindo.
        run: |
          databricks jobs run-now --json '{
            "job_id": ${{ steps.job.outputs.job_id }},
            "job_parameters": {"promotion_alias": "none"}
          }'

      - name: Capture the candidate version
        id: candidate
        # A versão é FIXADA aqui, e não resolvida na hora da promoção: entre a
        # revisão e o promote pode ter rodado um treino agendado, e quem
        # aprovar inspecionou uma versão específica.
        run: |
          set -euo pipefail
          version=$(mlp-model-version \
            --catalog "${{ inputs.catalog }}" \
            --domain "${{ inputs.domain }}" \
            --model_name "${{ inputs.model-name }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Candidato registrado: v$version (NAO promovido)"

      - name: Summarise what needs review
        env:
          # `join` sobre nulo quebra a avaliação, e `client_payload` é nulo
          # quando o retreino foi disparado à mão em vez de por drift.
          DRIFTED: >-
            ${{ github.event.client_payload.drifted_columns
                && join(github.event.client_payload.drifted_columns, ', ')
                || 'disparo manual' }}
        # O resumo é onde o número da versão fica registrado. Quem for promover
        # precisa dele, e caçá-lo no MLflow depois convida a promover a versão
        # errada — a "mais recente" pode ser outra se um treino agendado rodou
        # nesse meio-tempo.
        run: |
          {
            echo "### Candidato aguardando revisao"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| modelo | \`${{ inputs.catalog }}.${{ inputs.domain }}_models.${{ inputs.model-name }}\` |"
            echo "| versao candidata | **v${{ steps.candidate.outputs.version }}** |"
            echo "| alias atual | \`${{ inputs.alias }}\` (ainda na versao anterior) |"
            echo "| colunas com drift | $DRIFTED |"
            echo ""
            echo "Compare a run desta versao contra a do champion atual no MLflow."
            echo "Drift indica que o mundo mudou, nao que o modelo novo esteja melhor:"
            echo "ele pode ter treinado sobre o mesmo dado deslocado e aprendido o"
            echo "deslocamento."
            echo ""
            echo "Para promover: workflow **Promote Model**, com"
            echo "\`version=${{ steps.candidate.outputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
