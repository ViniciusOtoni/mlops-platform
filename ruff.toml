target-version = "py311"
line-length = 120

# Sem isso, ruff usa o diretório de invocação como raiz implícita de detecção
# de first-party — o que muda o resultado dependendo de onde o comando roda
# (o CI sempre invoca de dentro do pacote via `working-directory`, então "src"
# aqui sempre resolve para "<pacote>/src", nunca a raiz do pacote inteira —
# isso evita classificar pastas como examples/scripts/tests como first-party
# só por estarem no mesmo nível de src/).
src = ["src"]

# notebooks/ são fonte de notebook Databricks (marcadores de célula
# "# COMMAND ----------", globais injetados em runtime como dbutils/spark) —
# não são módulos Python importáveis, não fazem sentido lintar como tal.
extend-exclude = ["**/notebooks/**"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]

[lint.isort]
known-first-party = [
    "mlplatform",
    "exemplo_features",
    "exemplo_training",
    "exemplo_serving_batch",
    "exemplo_serving_online",
    "exemplo_monitoring",
    # Transitório: o exemplo-domain ainda pina os quatro pacotes antigos por tag
    # e só migra para o mlplatform mais adiante. Enquanto isso ele continua
    # importando estes nomes — tirá-los daqui agora faria o isort reclassificá-los
    # como third-party e quebraria o CI do domínio, num repositório que este PR
    # nem toca. Removê-los é a última etapa da migração do domínio.
    "platform_core",
    "feature_platform",
    "training_platform",
    "serving_platform",
    "monitoring_platform",
]

# ---------------------------------------------------------------------------
# Contrato de fronteiras do mlplatform.
#
# Com quatro repositórios separados, o acoplamento entre contextos era impossível
# por construção. Consolidando num pacote só, ele passa a custar um import — e
# reapareceria em semanas se dependesse de disciplina em code review. Estas
# regras tornam a fronteira verificável em CI.
#
# Falta uma terceira regra: o core/ não pode importar infraestrutura (pyspark,
# mlflow, sklearn, databricks.*). Ela ainda NÃO está aqui porque o código atual
# a viola — core/audit.py importa pyspark.sql.functions dentro de
# get_last_success_checkpoint. Entra quando essa função virar adapter.
# ---------------------------------------------------------------------------
[lint.flake8-tidy-imports.banned-api]
"mlplatform.features".msg = "bounded contexts não se importam entre si — compartilhe via mlplatform.core"
"mlplatform.training".msg = "bounded contexts não se importam entre si — compartilhe via mlplatform.core"
"mlplatform.serving".msg = "bounded contexts não se importam entre si — compartilhe via mlplatform.core"
"mlplatform.monitoring".msg = "bounded contexts não se importam entre si — compartilhe via mlplatform.core"

[lint.per-file-ignores]
# scripts/*.py fazem sys.path.insert antes do import — não são módulos do
# pacote instalável, são entry points standalone chamados pelo CI.
"**/scripts/*.py" = ["E402"]

# Os testes exercitam cada contexto de fora; e os entry points são o composition
# root, cujo trabalho é justamente montar os contextos. Ambos precisam importá-los.
"tests/**" = ["TID251"]
"**/entrypoints.py" = ["TID251"]

# O repositório de domínio consome os contextos — o contrato vale entre os
# contextos DENTRO do framework, não para quem está de fora dele.
"**/src/exemplo_*/**" = ["TID251"]
