target-version = "py311"
line-length = 120

# Sem isso, ruff usa o diretório de invocação como raiz implícita de detecção
# de first-party — o que muda o resultado dependendo de onde o comando roda
# (o CI sempre invoca de dentro do pacote via `working-directory`, então "src"
# aqui sempre resolve para "<pacote>/src", nunca a raiz do pacote inteira —
# isso evita classificar pastas como examples/scripts/tests como first-party
# só por estarem no mesmo nível de src/).
src = ["src"]

# notebooks/ são fonte de notebook Databricks (marcadores de célula
# "# COMMAND ----------", globais injetados em runtime como dbutils/spark) —
# não são módulos Python importáveis, não fazem sentido lintar como tal.
extend-exclude = ["**/notebooks/**"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]

[lint.isort]
known-first-party = [
    "mlplatform",
    "exemplo_features",
    "exemplo_training",
    "exemplo_serving_batch",
    "exemplo_serving_online",
    "exemplo_monitoring",
    # Transitório: o exemplo-domain ainda pina os quatro pacotes antigos por tag
    # e só migra para o mlplatform mais adiante. Enquanto isso ele continua
    # importando estes nomes — tirá-los daqui agora faria o isort reclassificá-los
    # como third-party e quebraria o CI do domínio, num repositório que este PR
    # nem toca. Removê-los é a última etapa da migração do domínio.
    "platform_core",
    "feature_platform",
    "training_platform",
    "serving_platform",
    "monitoring_platform",
]

# Este arquivo é o baseline compartilhado por TODO o ecossistema — framework e
# repositórios de domínio. Ele não carrega as regras de arquitetura interna do
# mlplatform: essas moram em `ruff-framework.toml`, que estende este e é usado só
# pelo platform-libs.
#
# A separação não é organizacional, é de correção: código de domínio importa
# pyspark e o SDK do Databricks legitimamente, e uma regra que proibisse isso
# aqui misfiraria em todo domínio — ou exigiria uma lista de exceções amarrada ao
# nome dos pacotes de cada domínio, que quebra no primeiro domínio novo.

[lint.per-file-ignores]
# scripts/*.py fazem sys.path.insert antes do import — não são módulos do
# pacote instalável, são entry points standalone chamados pelo CI.
"**/scripts/*.py" = ["E402"]
